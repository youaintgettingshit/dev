<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f0f0f;
            color: #fff;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .login-box {
            background: #2a2a3e;
            border: 1px solid #3a3a4e;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            color: #6366f1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #a0a0b0;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: #1a1a2e;
            border: 1px solid #3a3a4e;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #6366f1;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #6366f1;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #4f46e5;
        }

        .toggle-auth {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .toggle-auth button {
            background: none;
            color: #6366f1;
            width: auto;
            padding: 0;
        }

        .toggle-auth button:hover {
            text-decoration: underline;
            background: none;
        }

        /* Main App Layout */
        .app-container {
            display: none;
            height: 100vh;
            display: flex;
        }

        .app-container.active {
            display: flex;
        }

        .server-sidebar {
            width: 80px;
            background: #2a2a3e;
            border-right: 1px solid #3a3a4e;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 12px;
            overflow-y: auto;
        }

        .server-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #3a3a4e;
            border: none;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .server-btn:hover {
            background: #4a4a5e;
        }

        .server-btn.active {
            background: #6366f1;
        }

        .channel-sidebar {
            width: 240px;
            background: #1a1a2e;
            border-right: 1px solid #3a3a4e;
            display: flex;
            flex-direction: column;
        }

        .channel-header {
            padding: 16px;
            border-bottom: 1px solid #3a3a4e;
            font-weight: 600;
            font-size: 14px;
        }

        .channels-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .channel-item {
            padding: 8px 12px;
            margin: 4px 0;
            background: transparent;
            border: none;
            color: #a0a0b0;
            width: 100%;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            transition: all 0.2s;
        }

        .channel-item:hover {
            background: #2a2a3e;
            color: #fff;
        }

        .channel-item.active {
            background: #3a3a4e;
            color: #6366f1;
        }

        .channel-section {
            margin-bottom: 16px;
        }

        .channel-section-title {
            padding: 12px 12px 8px;
            font-size: 11px;
            font-weight: 700;
            color: #6a6a7a;
            text-transform: uppercase;
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid #3a3a4e;
            display: flex;
            gap: 8px;
        }

        .sidebar-footer button {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 16px;
            border-bottom: 1px solid #3a3a4e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 12px;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #6366f1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            flex-shrink: 0;
        }

        .message-content {
            flex: 1;
        }

        .message-header {
            display: flex;
            gap: 8px;
            margin-bottom: 4px;
        }

        .message-author {
            font-weight: 600;
            font-size: 14px;
        }

        .message-time {
            font-size: 12px;
            color: #6a6a7a;
        }

        .message-text {
            color: #a0a0b0;
            font-size: 14px;
        }

        .input-area {
            padding: 16px;
            border-top: 1px solid #3a3a4e;
            display: flex;
            gap: 12px;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            background: #2a2a3e;
            border: 1px solid #3a3a4e;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }

        .input-area input:focus {
            outline: none;
            border-color: #6366f1;
        }

        .input-area button {
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .voice-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2a2a3e;
            border: 1px solid #3a3a4e;
            border-radius: 8px;
            padding: 20px;
            width: 300px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            display: none;
        }

        .voice-panel.active {
            display: block;
        }

        .voice-panel h3 {
            margin-bottom: 12px;
            font-size: 14px;
        }

        .voice-users {
            background: #1a1a2e;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 16px;
            max-height: 150px;
            overflow-y: auto;
        }

        .voice-user {
            padding: 8px;
            font-size: 13px;
            color: #a0a0b0;
            display: flex;
            justify-content: space-between;
        }

        .voice-controls {
            display: flex;
            gap: 8px;
        }

        .voice-controls button {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }

        .voice-controls button {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }

        .error {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 8px;
        }

        /* Context Menu */
        .context-menu {
            position: fixed;
            background: #2a2a3e;
            border: 1px solid #3a3a4e;
            border-radius: 4px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            min-width: 150px;
            display: none;
        }

        .context-menu.active {
            display: block;
        }

        .context-menu-item {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 13px;
            color: #a0a0b0;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            transition: all 0.2s;
        }

        .context-menu-item:hover {
            background: #3a3a4e;
            color: #fff;
        }

        .context-menu-item.danger:hover {
            background: #ff6b6b;
            color: #fff;
        }

        .context-menu-divider {
            height: 1px;
            background: #3a3a4e;
            margin: 4px 0;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #2a2a3e;
            border: 1px solid #3a3a4e;
            border-radius: 8px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }

        .modal h3 {
            margin-bottom: 16px;
            font-size: 16px;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: #a0a0b0;
            cursor: pointer;
            font-size: 20px;
        }

        .webhooks-list {
            background: #1a1a2e;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 16px;
            max-height: 200px;
            overflow-y: auto;
        }

        .webhook-item {
            padding: 8px;
            margin-bottom: 8px;
            background: #2a2a3e;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .webhook-item button {
            padding: 4px 8px;
            font-size: 11px;
            background: #ff6b6b;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a4e;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a5e;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <div class="login-box">
            <h1>🎮 Discord Clone</h1>
            <div id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password">
                </div>
                <button onclick="handleLogin()">Login</button>
                <div class="toggle-auth">
                    Don't have an account? <button onclick="toggleAuth()">Register</button>
                </div>
                <div id="errorMsg" class="error"></div>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="appContainer" class="app-container">
        <!-- Server Sidebar -->
        <div class="server-sidebar" id="serverSidebar"></div>

        <!-- Channel Sidebar -->
        <div class="channel-sidebar">
            <div class="channel-header" id="serverName">Servers</div>
            <div class="channels-list" id="channelsList"></div>
            <div class="sidebar-footer">
                <button onclick="createChannel()">+ Channel</button>
                <button onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <h2 id="channelName">Select a channel</h2>
                <span>⚙️</span>
            </div>
            <div class="messages-container" id="messagesContainer"></div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">→</button>
            </div>
        </div>
    </div>

    <!-- Voice Panel -->
    <div id="voicePanel" class="voice-panel">
        <h3>🎤 In Voice Channel</h3>
        <div class="voice-users" id="voiceUsers"></div>
        <div class="voice-controls">
            <button id="muteBtn" onclick="toggleMute()">🔊 Mute</button>
            <button id="screenBtn" onclick="toggleScreenShare()">📺 Share</button>
            <button onclick="disconnectVoice()" style="background: #ff6b6b;">📞 Leave</button>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="contextMenu" class="context-menu">
        <button class="context-menu-item" onclick="showChannelMenu()">📋 Channel Info</button>
        <button class="context-menu-item" onclick="showWebhookModal()">🪝 Webhooks</button>
        <div class="context-menu-divider"></div>
        <button class="context-menu-item danger" onclick="deleteChannel()">🗑️ Delete</button>
    </div>

    <!-- Webhook Modal -->
    <div id="webhookModal" class="modal-overlay">
        <div class="modal" style="position: relative;">
            <button class="modal-close" onclick="closeWebhookModal()">✕</button>
            <h3>🪝 Channel Webhooks</h3>
            <div class="webhooks-list" id="webhooksList"></div>
            <div class="form-group">
                <label>Webhook Name</label>
                <input type="text" id="webhookName" placeholder="My Webhook">
            </div>
            <button onclick="createWebhook()" style="width: 100%; margin-bottom: 8px;">Create Webhook</button>
            <button onclick="closeWebhookModal()" style="width: 100%; background: #3a3a4e;">Close</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v10';
        let token = localStorage.getItem('token');
        let user = null;
        let currentServer = null;
        let currentChannel = null;
        let servers = [];
        let channels = [];
        let messages = [];
        let isLoginMode = true;
        let voiceSession = null;
        let isMuted = false;
        let isScreenSharing = false;

        // Initialize
        if (token) {
            showApp();
            loadData();
        }

        async function handleLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            if (!username || !password) {
                errorMsg.textContent = 'Please fill all fields';
                return;
            }

            try {
                const url = isLoginMode 
                    ? `${API_BASE}/auth/login?username=${username}&password=${password}`
                    : `${API_BASE}/auth/register`;

                const options = {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                };

                if (!isLoginMode) {
                    options.body = JSON.stringify({
                        username,
                        email: `${username}@discord.local`,
                        password
                    });
                }

                const res = await fetch(url, options);
                const data = await res.json();

                if (res.ok) {
                    token = data.access_token;
                    user = data.user;
                    localStorage.setItem('token', token);
                    document.getElementById('username').value = '';
                    document.getElementById('password').value = '';
                    errorMsg.textContent = '';
                    showApp();
                    loadData();
                } else {
                    errorMsg.textContent = data.detail || 'Error';
                }
            } catch (err) {
                errorMsg.textContent = 'Connection failed: ' + err.message;
            }
        }

        function toggleAuth() {
            isLoginMode = !isLoginMode;
            document.querySelector('.login-box h1').textContent = isLoginMode ? '🎮 Discord Clone' : '📝 Create Account';
            document.querySelector('button').textContent = isLoginMode ? 'Login' : 'Register';
            document.querySelector('.toggle-auth button').textContent = isLoginMode ? 'Register' : 'Login';
        }

        function showApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContainer').classList.add('active');
        }

        async function loadData() {
            await fetchUser();
            await fetchServers();
        }

        async function fetchUser() {
            try {
                const res = await fetch(`${API_BASE}/users/@me?token=${token}`);
                if (res.ok) {
                    user = await res.json();
                }
            } catch (err) {
                console.error('Failed to fetch user:', err);
            }
        }

        async function fetchServers() {
            try {
                const res = await fetch(`${API_BASE}/users/@me/servers?token=${token}`);
                if (res.ok) {
                    servers = await res.json();
                    renderServers();
                    if (servers.length && !currentServer) {
                        selectServer(servers[0].id);
                    }
                }
            } catch (err) {
                console.error('Failed to fetch servers:', err);
            }
        }

        function renderServers() {
            const sidebar = document.getElementById('serverSidebar');
            sidebar.innerHTML = '';
            servers.forEach(server => {
                const btn = document.createElement('button');
                btn.className = 'server-btn' + (currentServer === server.id ? ' active' : '');
                btn.textContent = server.icon_url;
                btn.onclick = () => selectServer(server.id);
                sidebar.appendChild(btn);
            });

            const addBtn = document.createElement('button');
            addBtn.className = 'server-btn';
            addBtn.textContent = '+';
            addBtn.onclick = createServer;
            sidebar.appendChild(addBtn);
        }

        async function selectServer(serverId) {
            currentServer = serverId;
            currentChannel = null;
            await fetchChannels();
            renderServers();
            renderChannels();
        }

        async function fetchChannels() {
            try {
                const res = await fetch(`${API_BASE}/servers/${currentServer}/channels?token=${token}`);
                if (res.ok) {
                    channels = await res.json();
                    if (channels.length && !currentChannel) {
                        selectChannel(channels[0].id);
                    }
                }
            } catch (err) {
                console.error('Failed to fetch channels:', err);
            }
        }

        function renderChannels() {
            const list = document.getElementById('channelsList');
            const serverName = servers.find(s => s.id === currentServer);
            document.getElementById('serverName').textContent = serverName?.name || 'Server';
            
            list.innerHTML = '';

            const textChannels = channels.filter(c => c.channel_type === 'text');
            if (textChannels.length) {
                const section = document.createElement('div');
                section.className = 'channel-section';
                section.innerHTML = '<div class="channel-section-title">Text Channels</div>';
                textChannels.forEach(ch => {
                    const btn = document.createElement('button');
                    btn.className = 'channel-item' + (currentChannel === ch.id ? ' active' : '');
                    btn.textContent = '# ' + ch.name;
                    btn.onclick = () => selectChannel(ch.id);
                    btn.oncontextmenu = (e) => {
                        e.preventDefault();
                        currentContextChannel = ch;
                        showContextMenu(e);
                    };
                    section.appendChild(btn);
                });
                list.appendChild(section);
            }

            const voiceChannels = channels.filter(c => c.channel_type === 'voice');
            if (voiceChannels.length) {
                const section = document.createElement('div');
                section.className = 'channel-section';
                section.innerHTML = '<div class="channel-section-title">Voice Channels</div>';
                voiceChannels.forEach(ch => {
                    const btn = document.createElement('button');
                    btn.className = 'channel-item';
                    btn.textContent = '🎤 ' + ch.name;
                    btn.onclick = () => connectVoice(ch.id);
                    section.appendChild(btn);
                });
                list.appendChild(section);
            }
        }

        async function selectChannel(channelId) {
            currentChannel = channelId;
            await fetchMessages();
            renderChannels();
            renderMessages();
            const channel = channels.find(c => c.id === channelId);
            document.getElementById('channelName').textContent = '# ' + (channel?.name || 'Channel');
            document.getElementById('messageInput').focus();
        }

        async function fetchMessages() {
            try {
                const res = await fetch(`${API_BASE}/channels/${currentChannel}/messages?token=${token}`);
                if (res.ok) {
                    messages = await res.json();
                }
            } catch (err) {
                console.error('Failed to fetch messages:', err);
            }
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message';
                const time = new Date(msg.created_at).toLocaleTimeString();
                div.innerHTML = `
                    <div class="message-avatar">${msg.author.username[0].toUpperCase()}</div>
                    <div class="message-content">
                        <div class="message-header">
                            <span class="message-author">${msg.author.username}</span>
                            <span class="message-time">${time}</span>
                        </div>
                        <div class="message-text">${msg.content}</div>
                    </div>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content) return;

            try {
                const res = await fetch(`${API_BASE}/channels/${currentChannel}/messages?token=${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });
                if (res.ok) {
                    input.value = '';
                    await fetchMessages();
                    renderMessages();
                }
            } catch (err) {
                console.error('Failed to send message:', err);
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        async function createServer() {
            const name = prompt('Server name:');
            if (!name) return;
            try {
                const res = await fetch(`${API_BASE}/servers?token=${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, icon_url: '🎮' })
                });
                if (res.ok) {
                    await fetchServers();
                }
            } catch (err) {
                console.error('Failed to create server:', err);
            }
        }

        async function createChannel() {
            const name = prompt('Channel name:');
            if (!name) return;
            try {
                const res = await fetch(`${API_BASE}/servers/${currentServer}/channels?token=${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, channel_type: 'text' })
                });
                if (res.ok) {
                    await fetchChannels();
                    renderChannels();
                }
            } catch (err) {
                console.error('Failed to create channel:', err);
            }
        }

        async function connectVoice(channelId) {
            try {
                const res = await fetch(`${API_BASE}/channels/${channelId}/voice/connect?token=${token}`, {
                    method: 'POST'
                });
                if (res.ok) {
                    voiceSession = await res.json();
                    document.getElementById('voicePanel').classList.add('active');
                }
            } catch (err) {
                console.error('Voice connect failed:', err);
            }
        }

        async function disconnectVoice() {
            if (!voiceSession) return;
            try {
                await fetch(`${API_BASE}/voice/sessions/${voiceSession.id}?token=${token}`, {
                    method: 'DELETE'
                });
                voiceSession = null;
                isMuted = false;
                isScreenSharing = false;
                document.getElementById('voicePanel').classList.remove('active');
            } catch (err) {
                console.error('Voice disconnect failed:', err);
            }
        }

        async function toggleMute() {
            if (!voiceSession) return;
            isMuted = !isMuted;
            try {
                await fetch(`${API_BASE}/voice/sessions/${voiceSession.id}?token=${token}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_muted: isMuted })
                });
                document.getElementById('muteBtn').textContent = isMuted ? '🔇 Unmute' : '🔊 Mute';
            } catch (err) {
                console.error('Failed to toggle mute:', err);
            }
        }

        async function toggleScreenShare() {
            if (!voiceSession) return;
            isScreenSharing = !isScreenSharing;
            try {
                await fetch(`${API_BASE}/voice/sessions/${voiceSession.id}?token=${token}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_screensharing: isScreenSharing })
                });
                document.getElementById('screenBtn').textContent = isScreenSharing ? '📹 Stop Share' : '📺 Share';
            } catch (err) {
                console.error('Failed to toggle screen share:', err);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            token = null;
            user = null;
            document.getElementById('appContainer').classList.remove('active');
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('errorMsg').textContent = '';
        }

        // Auto-refresh messages every 2 seconds
        setInterval(() => {
            if (currentChannel && token) {
                fetchMessages().then(renderMessages);
            }
        }, 2000);

        // Context menu handling
        let currentContextChannel = null;

        function showContextMenu(e) {
            const menu = document.getElementById('contextMenu');
            menu.style.left = e.pageX + 'px';
            menu.style.top = e.pageY + 'px';
            menu.classList.add('active');
            
            document.addEventListener('click', hideContextMenu);
        }

        function hideContextMenu() {
            document.getElementById('contextMenu').classList.remove('active');
            document.removeEventListener('click', hideContextMenu);
        }

        function showChannelMenu() {
            if (!currentContextChannel) return;
            alert(`Channel: ${currentContextChannel.name}\nType: ${currentContextChannel.channel_type}\nCreated: ${new Date(currentContextChannel.created_at).toLocaleString()}`);
            hideContextMenu();
        }

        async function deleteChannel() {
            if (!currentContextChannel) return;
            if (!confirm(`Delete channel "${currentContextChannel.name}"?`)) return;
            
            try {
                // Note: You need to add DELETE endpoint for channels in backend
                alert('Channel deletion endpoint not yet implemented');
                hideContextMenu();
            } catch (err) {
                console.error('Failed to delete channel:', err);
            }
        }

        async function showWebhookModal() {
            if (!currentContextChannel) return;
            currentChannel = currentContextChannel.id;
            await loadWebhooks();
            document.getElementById('webhookModal').classList.add('active');
            hideContextMenu();
        }

        function closeWebhookModal() {
            document.getElementById('webhookModal').classList.remove('active');
            document.getElementById('webhookName').value = '';
        }

        async function loadWebhooks() {
            try {
                const res = await fetch(`${API_BASE}/channels/${currentChannel}/webhooks?token=${token}`);
                if (res.ok) {
                    const webhooks = await res.json();
                    const list = document.getElementById('webhooksList');
                    list.innerHTML = '';
                    
                    if (webhooks.length === 0) {
                        list.innerHTML = '<div style="color: #6a6a7a; text-align: center; padding: 20px;">No webhooks yet</div>';
                    } else {
                        webhooks.forEach(wh => {
                            const item = document.createElement('div');
                            item.className = 'webhook-item';
                            item.innerHTML = `
                                <div>
                                    <div style="font-weight: 600;">${wh.name}</div>
                                    <div style="font-size: 11px; color: #6a6a7a;">${wh.token.substring(0, 12)}...</div>
                                </div>
                                <button onclick="deleteWebhook('${wh.id}')">Delete</button>
                            `;
                            list.appendChild(item);
                        });
                    }
                }
            } catch (err) {
                console.error('Failed to load webhooks:', err);
            }
        }

        async function createWebhook() {
            const name = document.getElementById('webhookName').value;
            if (!name.trim()) {
                alert('Enter webhook name');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/channels/${currentChannel}/webhooks?token=${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, avatar_url: 'https://via.placeholder.com/40' })
                });
                if (res.ok) {
                    document.getElementById('webhookName').value = '';
                    await loadWebhooks();
                }
            } catch (err) {
                console.error('Failed to create webhook:', err);
            }
        }

        async function deleteWebhook(webhookId) {
            if (!confirm('Delete webhook?')) return;
            try {
                await fetch(`${API_BASE}/webhooks/${webhookId}?token=${token}`, {
                    method: 'DELETE'
                });
                await loadWebhooks();
            } catch (err) {
                console.error('Failed to delete webhook:', err);
            }
        }
    </script>
</body>
</html>
